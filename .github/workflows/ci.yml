name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck (src + tests + api handlers)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Applies schema + migrations only when a DATABASE_URL secret is configured.
      # Idempotent (CREATE TABLE/INDEX IF NOT EXISTS), safe to run on every push.
      - name: Apply database migrations
        if: ${{ vars.APPLY_MIGRATIONS == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
